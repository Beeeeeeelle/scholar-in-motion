name: Bug report
description: Report a reproducible problem in the template.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Scholar in Motion. Please remove private data and credentials before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. See...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Ruby version, and deployment method.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or build output
      description: Add only the evidence needed to understand the issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed personal data, secrets, and analytics tokens.
          required: true
